server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: PawConnect
  config:
    import:
      - "optional:file:application-local.yaml"
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  payment:
    window-minutes: ${PAYMENT_WINDOW_MINUTES:15}

application:
  init:
    default-admin:
      enabled: ${INIT_DEFAULT_ADMIN_ENABLED:true}
      email: ${ADMIN_DEFAULT_EMAIL:admin@gmail.com}
      password: ${ADMIN_DEFAULT_PASSWORD:admin1234}
      first-name: ${ADMIN_DEFAULT_FIRST_NAME:Super}
      last-name: ${ADMIN_DEFAULT_LAST_NAME:Admin}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      - X-Requested-With
      - X-Request-ID
    exposed-headers:
      - Authorization
      - X-Request-ID
    allow-credentials: true
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    mock-client: ${RAZORPAY_MOCK_CLIENT:false}
  websocket:
    endpoint: /ws
    app-destination-prefix: /app
    user-destination-prefix: /user
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@pawconnect.care}}
      from-name: ${MAIL_FROM_NAME:PawConnect}
    sms:
      enabled: ${NOTIFICATION_SMS_ENABLED:false}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}

