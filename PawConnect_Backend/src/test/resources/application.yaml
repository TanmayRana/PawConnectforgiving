      expiration: 900000
      refresh-token:
        expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000
  razorpay:
    key-id: rzp_test_sampleKeyId123
    key-secret: sampleKeySecret456
    webhook-secret: sampleWebhookSecret789
    mock-client: true
