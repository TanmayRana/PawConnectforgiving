spring:
  application:
    name: PawConnect-Test
  datasource:
    url: jdbc:h2:mem:pawconnect_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
